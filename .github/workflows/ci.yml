name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash scripts/check-ai-workflows-sync.sh
        env:
          AI_WORKFLOWS_TOKEN: ${{ secrets.AI_WORKFLOWS_TOKEN }}
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
